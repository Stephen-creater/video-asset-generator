<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"TWO DIFFERENT MODELS"},
  {"id":"title","type":"string","label":"标题","default":"两种路径，产生两种结果"},
  {"id":"leftTitle","type":"string","label":"左侧标题","default":"传统方案"},
  {"id":"leftPoint1","type":"string","label":"左侧要点一","default":"集中控制"},
  {"id":"leftPoint2","type":"string","label":"左侧要点二","default":"按次付费"},
  {"id":"rightTitle","type":"string","label":"右侧标题","default":"开放方案"},
  {"id":"rightPoint1","type":"string","label":"右侧要点一","default":"自主部署"},
  {"id":"rightPoint2","type":"string","label":"右侧要点二","default":"快速扩散"},
  {"id":"accent","type":"color","label":"强调色","default":"#72e6ff"}
]'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>双栏对比</title>
  <style>
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Regular.otf")}
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Bold.otf");font-weight:700}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070a;font-family:"Alibaba PuHuiTi",sans-serif}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .clip,.stage{position:absolute;inset:0}
    .stage{background:linear-gradient(180deg,#11151d,#05070a);color:#f7f9fb}
    .safe{position:absolute;left:162px;width:756px}
    .kicker{top:180px;color:var(--accent);font-size:22px;font-weight:700;letter-spacing:5px}
    h1{top:245px;margin:0;font-size:76px;line-height:1.1;font-weight:700}
    .panels{position:absolute;left:162px;top:600px;width:756px;height:800px;display:grid;grid-template-columns:1fr 1fr;gap:44px}
    .panel{position:relative;border:1px solid #ffffff1f;border-radius:34px;overflow:hidden;padding:54px 32px;background:linear-gradient(180deg,#171c24,#090c11)}
    .right{background:linear-gradient(180deg,#0b2b35,#071217)}
    .glow{position:absolute;inset:0;border-radius:34px;box-shadow:inset 0 0 70px color-mix(in srgb,var(--accent) 20%,transparent);pointer-events:none}
    .panel h2{margin:0;text-align:center;font-size:48px}.right h2{color:var(--accent)}
    .symbol{position:absolute;left:67px;top:210px;width:230px;height:230px}
    .vault{border:8px solid #77818d;border-radius:28px}
    .vault:after{content:"";position:absolute;left:67px;top:67px;width:78px;height:78px;border:7px solid #77818d;border-radius:50%}
    .grid{display:grid;grid-template-columns:repeat(3,54px);grid-auto-rows:54px;gap:24px}
    .dot{width:40px;height:40px;border:3px solid var(--accent);transform:rotate(45deg)}
    .points{position:absolute;left:32px;right:32px;bottom:70px;text-align:center;color:#b8c2cc;font-size:28px;line-height:1.65}
  </style>
</head>
<body>
  <div id="root" data-composition-id="comparison" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <section id="comparison-scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="stage">
        <div class="safe kicker" data-var-text="kicker">TWO DIFFERENT MODELS</div>
        <h1 class="safe" data-var-text="title">两种路径，产生两种结果</h1>
        <div class="panels">
          <div class="panel left">
            <h2 data-var-text="leftTitle">传统方案</h2><div class="symbol vault"></div>
            <div class="points"><div data-var-text="leftPoint1">集中控制</div><div data-var-text="leftPoint2">按次付费</div></div>
          </div>
          <div class="panel right">
            <div class="glow"></div>
            <h2 data-var-text="rightTitle">开放方案</h2>
            <div class="symbol grid"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
            <div class="points"><div data-var-text="rightPoint1">自主部署</div><div data-var-text="rightPoint2">快速扩散</div></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.from(".kicker",{opacity:0,y:-24,duration:.5,ease:"power3.out"},.08)
      .from("h1",{opacity:0,y:55,duration:.7,ease:"power3.out"},.2)
      .from(".panel",{opacity:0,y:90,stagger:.18,duration:.75,ease:"power4.out"},.85)
      .from(".vault",{opacity:0,scale:.5,rotation:-10,duration:.7,ease:"back.out(1.4)"},1.45)
      .from(".dot",{opacity:0,scale:.2,stagger:.085,duration:.38,ease:"back.out(1.7)"},1.45)
      .fromTo(".glow",{opacity:.15},{opacity:.75,duration:8,ease:"none"},0);
    window.__timelines=window.__timelines||{};
    window.__timelines["comparison"]=tl;
  </script>
</body>
</html>
