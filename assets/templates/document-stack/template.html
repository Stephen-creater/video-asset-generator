<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"REPORT / MATERIAL"},
  {"id":"title","type":"string","label":"标题","default":"一份信息密集的研究材料"},
  {"id":"subtitle","type":"string","label":"说明","default":"多页内容汇集为一份完整报告"},
  {"id":"pageCount","type":"string","label":"页数","default":"36 PAGES"},
  {"id":"documentLabel","type":"string","label":"文档标签","default":"RESEARCH REPORT"},
  {"id":"footer","type":"string","label":"底部说明","default":"适用：报告、白皮书、研究材料与页数信息"},
  {"id":"accent","type":"color","label":"强调色","default":"#70e9ff"}
]'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>材料堆栈</title>
  <style>
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Regular.otf");font-weight:400}
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Bold.otf");font-weight:700}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#061017;font-family:"Alibaba PuHuiTi",sans-serif}
    #root,.clip,.stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}
    .stage{color:#f7fbff;background:radial-gradient(circle at 75% 16%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 34%),linear-gradient(180deg,#0a1a23,#061017)}
    .stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#70e9ff0b 1px,transparent 1px),linear-gradient(90deg,#70e9ff0b 1px,transparent 1px);background-size:72px 72px}
    .content{position:absolute;left:162px;top:240px;width:756px}
    .kicker{color:var(--accent);font-size:22px;font-weight:700;letter-spacing:5px}
    h1{margin:30px 0 0;font-size:76px;line-height:1.08}
    .subtitle{margin-top:28px;width:720px;color:#a9bdc7;font-size:28px;line-height:1.45}
    .stack{position:absolute;left:130px;top:610px;width:820px;height:660px}
    .sheet{position:absolute;width:650px;height:430px;border-radius:30px;border:2px solid #d4e2e5;background:linear-gradient(160deg,#f5fafb,#bfced2);box-shadow:0 30px 70px #0007}
    .back2{left:25px;top:95px;opacity:.42}.back1{left:75px;top:48px;opacity:.7}.front{left:125px;top:0;padding:56px}
    .doc-label{color:#17303b;font-size:22px;font-weight:700;letter-spacing:4px}
    .line{height:18px;margin-top:30px;border-radius:9px;background:#17303b}.line.short{width:58%}.line.mid{width:78%}.line.long{width:92%}
    .badge{position:absolute;right:42px;bottom:38px;padding:12px 20px;border-radius:14px;background:#102b37;color:var(--accent);font-size:22px;font-weight:700}
    .footer{position:absolute;left:162px;top:1350px;width:756px;border-top:3px solid var(--accent);padding-top:24px;color:#91a7b1;font-size:23px}
  </style>
</head>
<body>
  <div id="root" data-composition-id="document-stack" data-start="0" data-duration="7" data-width="1080" data-height="1920">
    <section id="document-stack-scene" class="clip" data-start="0" data-duration="7" data-track-index="1">
      <div class="stage">
        <div class="content">
          <div class="kicker" data-var-text="kicker">REPORT / MATERIAL</div>
          <h1 data-var-text="title">一份信息密集的研究材料</h1>
          <div class="subtitle" data-var-text="subtitle">多页内容汇集为一份完整报告</div>
        </div>
        <div class="stack">
          <div class="sheet back2"></div>
          <div class="sheet back1"></div>
          <div class="sheet front">
            <div class="doc-label" data-var-text="documentLabel">RESEARCH REPORT</div>
            <div class="line short"></div><div class="line long"></div><div class="line mid"></div>
            <div class="badge" data-var-text="pageCount">36 PAGES</div>
          </div>
        </div>
        <div class="footer" data-var-text="footer">适用：报告、白皮书、研究材料与页数信息</div>
      </div>
    </section>
  </div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.from(".kicker",{y:-24,opacity:0,duration:.45,ease:"power3.out"},.08)
      .from("h1",{x:-70,opacity:0,duration:.65,ease:"power4.out"},.2)
      .from(".subtitle",{y:28,opacity:0,duration:.5,ease:"power2.out"},.48)
      .from(".back2",{x:-120,y:80,opacity:0,duration:.65,ease:"power3.out"},.72)
      .from(".back1",{x:110,y:65,opacity:0,duration:.65,ease:"power3.out"},.88)
      .from(".front",{y:130,scale:.82,opacity:0,duration:.75,ease:"back.out(1.35)"},1.02)
      .from(".front .line",{scaleX:0,transformOrigin:"left",duration:.42,stagger:.1,ease:"power2.out"},1.55)
      .from(".badge",{scale:.6,duration:.42,ease:"back.out(1.5)"},1.92)
      .from(".footer",{scaleX:0,transformOrigin:"left",opacity:0,duration:.5,ease:"power2.out"},2.15);
    window.__timelines=window.__timelines||{};
    window.__timelines["document-stack"]=tl;
  </script>
</body>
</html>
