<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"KEEP SHARING"},
  {"id":"title","type":"string","label":"标题","default":"想继续看这类一手观点？"},
  {"id":"actionLabel","type":"string","label":"行动提示","default":"评论区回复"},
  {"id":"actionText","type":"string","label":"行动文字","default":"有帮助"},
  {"id":"footer","type":"string","label":"结尾说明","default":"我会继续整理更多高质量内容"},
  {"id":"accent","type":"color","label":"强调色","default":"#72e6ff"}
]'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>结尾钩子</title>
  <style>
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Regular.otf")}
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Bold.otf");font-weight:700}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#04070a;font-family:"Alibaba PuHuiTi",sans-serif}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .clip,.stage{position:absolute;inset:0}
    .stage{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--accent) 18%,#12324a),#071018 55%,#030405);color:#f7f9fb}
    .safe{position:absolute;left:162px;width:756px}
    .kicker{top:210px;color:var(--accent);font-size:22px;font-weight:700;letter-spacing:5px}
    h1{top:285px;margin:0;font-size:78px;line-height:1.1;font-weight:700}
    .card{top:720px;height:430px;border-radius:54px;border:2px solid #ffffff24;background:linear-gradient(145deg,#101d2a,#071019);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 90px color-mix(in srgb,var(--accent) 18%,transparent)}
    .card span{font-size:40px;color:#bac5d1}
    .card b{margin-top:18px;color:var(--accent);font-size:150px;line-height:1;font-weight:700}
    .footer{top:1310px;color:#aab7c4;font-size:25px;line-height:1.5;text-align:center}
  </style>
</head>
<body>
  <div id="root" data-composition-id="cta" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <section id="cta-scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="stage">
        <div class="safe kicker" data-var-text="kicker">KEEP SHARING</div>
        <h1 class="safe" data-var-text="title">想继续看这类一手观点？</h1>
        <div class="safe card"><span data-var-text="actionLabel">评论区回复</span><b data-var-text="actionText">有帮助</b></div>
        <div class="safe footer" data-var-text="footer">我会继续整理更多高质量内容</div>
      </div>
    </section>
  </div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.from(".kicker",{opacity:0,y:-24,duration:.5,ease:"power3.out"},.08)
      .from("h1",{opacity:0,y:55,duration:.7,ease:"power3.out"},.22)
      .from(".card",{opacity:0,y:75,scale:.78,duration:.8,ease:"back.out(1.45)"},.9)
      .from(".card b",{opacity:0,scale:.5,duration:.7,ease:"elastic.out(1,.5)"},1.55)
      .from(".footer",{opacity:0,y:24,duration:.55,ease:"power3.out"},2.05)
      .to(".card",{scale:1.025,duration:2,ease:"sine.inOut",repeat:1,yoyo:true},3);
    window.__timelines=window.__timelines||{};
    window.__timelines["cta"]=tl;
  </script>
</body>
</html>
