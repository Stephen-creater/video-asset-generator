<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"THE CORE QUESTION"},
  {"id":"question","type":"string","label":"问题","default":"巨额投入，究竟换来了多少领先？"},
  {"id":"attribution","type":"string","label":"补充说明","default":"这是整个讨论最值得追问的问题"},
  {"id":"accent","type":"color","label":"强调色","default":"#ffbd55"}
]'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080,height=1920">
  <title>问号设问</title>
  <style>
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Regular.otf")}
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Bold.otf");font-weight:700}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070a;font-family:"Alibaba PuHuiTi",sans-serif}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden}
    .clip,.stage{position:absolute;inset:0}
    .stage{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 18%,#101016),#05070a 54%);color:#f8fafc}
    .kicker{position:absolute;left:162px;top:190px;width:756px;color:#8b9baa;font-size:22px;font-weight:700;letter-spacing:5px;text-align:center}
    .ring{position:absolute;border:2px solid #ffffff20;border-radius:50%}
    .ring1{left:70px;top:330px;width:940px;height:940px}
    .ring2{left:190px;top:450px;width:700px;height:700px}
    .mark{position:absolute;left:352px;top:500px;width:376px;color:var(--accent);font-size:520px;line-height:.8;font-weight:700;text-align:center;text-shadow:0 0 100px color-mix(in srgb,var(--accent) 35%,transparent)}
    h1{position:absolute;left:162px;top:1120px;width:756px;margin:0;font-size:72px;line-height:1.16;font-weight:700;text-align:center}
    .attribution{position:absolute;left:162px;top:1435px;width:756px;color:#9aa8b5;font-size:23px;line-height:1.5;text-align:center}
  </style>
</head>
<body>
  <div id="root" data-composition-id="question" data-start="0" data-duration="8" data-width="1080" data-height="1920">
    <section id="question-scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="stage">
        <div class="kicker" data-var-text="kicker">THE CORE QUESTION</div>
        <div class="ring ring1"></div><div class="ring ring2"></div>
        <div class="mark">?</div>
        <h1 data-var-text="question">巨额投入，究竟换来了多少领先？</h1>
        <div class="attribution" data-var-text="attribution">这是整个讨论最值得追问的问题</div>
      </div>
    </section>
  </div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.from(".kicker",{opacity:0,duration:.5,ease:"none"},.1)
      .from(".ring",{opacity:0,scale:.35,stagger:.18,duration:1,ease:"expo.out"},.15)
      .from(".mark",{opacity:0,scale:.2,rotation:-20,duration:.9,ease:"back.out(1.6)"},.4)
      .to(".mark",{rotation:3,duration:6.5,ease:"sine.inOut"},1.4)
      .from("h1",{opacity:0,y:70,duration:.75,ease:"power4.out"},1.4)
      .from(".attribution",{opacity:0,duration:.55,ease:"none"},1.9);
    window.__timelines=window.__timelines||{};
    window.__timelines["question"]=tl;
  </script>
</body>
</html>
