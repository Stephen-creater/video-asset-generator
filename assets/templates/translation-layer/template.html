<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"kicker","type":"string","label":"眉题","default":"SYSTEM / TRANSLATION"},
  {"id":"title","type":"string","label":"标题上行","default":"统一表达需求"},
  {"id":"highlightTitle","type":"string","label":"标题强调行","default":"再适配多种底层"},
  {"id":"inputLabel","type":"string","label":"输入层","default":"业务意图"},
  {"id":"layerLabel","type":"string","label":"翻译层","default":"翻译层"},
  {"id":"layerNote","type":"string","label":"翻译层说明","default":"统一接口与规则"},
  {"id":"output1","type":"string","label":"输出一","default":"平台 A"},
  {"id":"output2","type":"string","label":"输出二","default":"平台 B"},
  {"id":"output3","type":"string","label":"输出三","default":"平台 C"},
  {"id":"footer","type":"string","label":"底部说明","default":"适用：兼容层、中间件、协议转换、跨平台适配"},
  {"id":"accent","type":"color","label":"强调色","default":"#f0b94d"}
]'>
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=1080,height=1920"><title>翻译层</title>
  <style>
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Regular.otf");font-weight:400}
    @font-face{font-family:"Alibaba PuHuiTi";src:url("assets/fonts/AlibabaPuHuiTi-3-Bold.otf");font-weight:700}
    *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#071118;font-family:"Alibaba PuHuiTi",sans-serif}
    #root,.clip,.stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}.stage{color:#f7fbff;background:radial-gradient(circle at 50% 60%,#17313a,#071118 58%)}
    .head{position:absolute;left:162px;top:240px;width:756px}.kicker{color:var(--accent);font-size:22px;font-weight:700;letter-spacing:5px}
    h1{position:relative;margin:28px 0 0;width:756px;height:184px;font-size:72px;line-height:1}h1 span,h1 b{position:absolute;left:0;width:756px;height:80px;display:block}h1 span{top:0}h1 b{top:96px;color:var(--accent)}
    .flow{position:absolute;left:162px;top:585px;width:756px;height:700px}.input{position:absolute;left:228px;top:0;width:300px;height:110px;border:3px solid #8ba1a8;border-radius:55px;display:grid;place-items:center;background:#0c1b23;font-size:34px;font-weight:700}
    .stem{position:absolute;left:373px;top:110px;width:10px;height:112px;background:#75dce3;transform-origin:top}.layer{position:absolute;left:133px;top:222px;width:490px;height:190px;border-radius:30px;background:linear-gradient(145deg,var(--accent),#d78c22);color:#101820;display:grid;place-content:center;text-align:center;box-shadow:0 28px 70px #0007}
    .layer b{font-size:54px}.layer span{margin-top:12px;font-size:23px}.branch-stem{position:absolute;left:373px;top:412px;width:10px;height:100px;background:#75dce3;transform-origin:top}.branch{position:absolute;left:115px;top:508px;width:526px;height:6px;background:#75dce3;transform-origin:center}
    .outputs{position:absolute;left:0;top:510px;width:756px;display:flex;justify-content:space-between}.output{margin-top:52px;width:220px;height:126px;border:3px solid #45606a;border-radius:24px;background:#0b171e;display:grid;place-items:center;font-size:30px;font-weight:700}.pin{position:absolute;top:0;width:8px;height:52px;background:#75dce3}.p1{left:106px}.p2{left:374px}.p3{right:106px}
    .footer{position:absolute;left:162px;top:1360px;width:756px;color:#91a7b1;font-size:23px;border-top:2px solid #344b55;padding-top:22px}
  </style>
</head>
<body>
  <div id="root" data-composition-id="translation-layer" data-start="0" data-duration="7" data-width="1080" data-height="1920">
    <section id="translation-layer-scene" class="clip" data-start="0" data-duration="7" data-track-index="1"><div class="stage">
      <div class="head"><div class="kicker" data-var-text="kicker">SYSTEM / TRANSLATION</div><h1><span data-var-text="title">统一表达需求</span><b data-var-text="highlightTitle">再适配多种底层</b></h1></div>
      <div class="flow"><div class="input" data-var-text="inputLabel">业务意图</div><div class="stem"></div><div class="layer"><b data-var-text="layerLabel">翻译层</b><span data-var-text="layerNote">统一接口与规则</span></div><div class="branch-stem"></div><div class="branch"></div><div class="outputs"><i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><div class="output" data-var-text="output1">平台 A</div><div class="output" data-var-text="output2">平台 B</div><div class="output" data-var-text="output3">平台 C</div></div></div>
      <div class="footer" data-var-text="footer">适用：兼容层、中间件、协议转换、跨平台适配</div>
    </div></section>
  </div>
  <script src="assets/gsap.min.js"></script>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.from(".kicker",{y:-24,opacity:0,duration:.4,ease:"power3.out"},.08)
      .from("h1",{x:-60,opacity:0,duration:.62,ease:"power4.out"},.2)
      .from(".input",{y:-42,opacity:0,duration:.48,ease:"power3.out"},.65)
      .from(".stem",{scaleY:0,duration:.38,ease:"power2.out"},.98)
      .from(".layer",{scale:.72,opacity:0,duration:.58,ease:"back.out(1.5)"},1.25)
      .from(".branch-stem",{scaleY:0,duration:.34,ease:"power2.out"},1.72)
      .from(".branch",{scaleX:0,duration:.46,ease:"power2.out"},1.95)
      .from(".pin",{scaleY:0,duration:.3,stagger:.08,ease:"power2.out"},2.25)
      .from(".output",{y:45,opacity:0,duration:.46,stagger:.13,ease:"power3.out"},2.45)
      .from(".footer",{y:24,opacity:0,duration:.45,ease:"power2.out"},3.0);
    window.__timelines=window.__timelines||{};window.__timelines["translation-layer"]=tl;
  </script>
</body>
</html>
